name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VER="$(printf '%s\n' "$JAVA_VER_LINE" | sed -n 's/.*"\([0-9][0-9]*\(\.[0-9][0-9]*\)*\)[^"]*".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "ERROR: Unable to detect active Java version from: $JAVA_VER_LINE" >&2
            exit 1
          fi
          MAJOR_VER="$(printf '%s' "$RAW_VER" | cut -d'.' -f1)"
          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER="$(printf '%s' "$RAW_VER" | cut -d'.' -f2)"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse Java major version from: $RAW_VER" >&2
            exit 1
          fi
          echo "Detected active Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java $MAJOR_VER." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            KEYTOOL_BIN="keytool"
          fi
          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore." >&2
            exit 1
          fi
          echo "Temporary ./debug.keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:" >&2
              find app/build/outputs/apk -type f -name "*.apk" >&2 || true
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ] || [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: $EXPECTED_APK is not a valid non-empty .apk file." >&2
            exit 1
          fi
          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "ERROR: Verified debug APK is missing at $SOURCE_APK" >&2
            exit 1
          fi
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\{2,\}/-/g; s/^[-.]*//; s/[-.]*$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-apk-XXXXXX")"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Failed to prepare release APK asset at $ASSET_PATH" >&2
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          gh --version
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Prepared release asset is missing, empty, or not an .apk file: $ASSET_PATH" >&2
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "- **Purpose:** Intended for testing only (not a Play Store production release)" \
            "- **Signing:** Signed only with a temporary debug keystore" \
            "- **APK Asset:** \`${ASSET_NAME}\`" \
            > "$NOTES_FILE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "Release APK Asset: ${ASSET_NAME}"
            {
              echo "### Debug APK Build & GitHub Release Published"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`${ASSET_NAME}\`"
              echo "- Download the APK directly from the **Assets** section on the release page above."
              echo "- The normal GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag ${RELEASE_TAG}. The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Warning: GitHub Release Publishing Failed"
              echo ""
              echo "- The debug APK build and artifact upload **succeeded**."
              echo "- GitHub Release publishing failed, so no release URL was generated."
              echo "- Download the backup APK from the GitHub Actions artifact named \`app-debug-apk\` on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
